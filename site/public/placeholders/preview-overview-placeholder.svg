<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="halftoneCharcoal" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.35" fill="#30343A" opacity="0.28" />
    </pattern>
    <pattern id="halftoneCobalt" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#2148B8" opacity="0.24" />
    </pattern>
  </defs>

  <!-- Warm Paper Substrate -->
  <rect width="1200" height="800" fill="#F5F1E8" />

  <!-- Outer Editorial Ruled Frame -->
  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#30343A" stroke-width="1.5" />
  <line x1="36" y1="88" x2="1164" y2="88" stroke="#30343A" stroke-width="1" />
  <line x1="36" y1="712" x2="1164" y2="712" stroke="#30343A" stroke-width="1" />

  <!-- Registration Crosshairs (Cobalt Plate) -->
  <g stroke="#2148B8" stroke-width="1.2" fill="none">
    <circle cx="64" cy="62" r="7" />
    <line x1="53" y1="62" x2="75" y2="62" />
    <line x1="64" y1="51" x2="64" y2="73" />
    <circle cx="1136" cy="62" r="7" />
    <line x1="1125" y1="62" x2="1147" y2="62" />
    <line x1="1136" y1="51" x2="1136" y2="73" />
  </g>

  <text x="88" y="67" fill="#30343A" font-family="Geist Mono, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
    PLATE 01 · OVERLAY SURFACE SPECIMEN
  </text>
  <text x="910" y="67" fill="#2148B8" font-family="Geist Mono, monospace" font-size="12" font-weight="500">
    INK: #30343A + #2148B8
  </text>

  <!-- Host Editor Wireframe (Left Zone with Active Negative Space) -->
  <g transform="translate(84, 136)">
    <rect width="460" height="480" fill="#F5F1E8" stroke="#30343A" stroke-width="1.5" />
    <line x1="0" y1="36" x2="460" y2="36" stroke="#30343A" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="none" stroke="#30343A" stroke-width="1.2" />
    <circle cx="34" cy="18" r="4" fill="none" stroke="#30343A" stroke-width="1.2" />
    <text x="54" y="22" fill="#30343A" font-family="Geist Mono, monospace" font-size="11">HOST_WINDOW · WS_EX_NOACTIVATE</text>

    <!-- Document Lines -->
    <line x1="36" y1="88" x2="360" y2="88" stroke="#30343A" stroke-width="2" opacity="0.35" />
    <line x1="36" y1="116" x2="400" y2="116" stroke="#30343A" stroke-width="2" opacity="0.35" />

    <!-- Highlighted Selection Area (Cobalt Overprint Plate) -->
    <rect x="34" y="140" width="320" height="34" fill="url(#halftoneCobalt)" stroke="#2148B8" stroke-width="1.5" />
    <text x="46" y="162" fill="#2148B8" font-family="Geist Mono, monospace" font-size="12" font-weight="600">SELECTED_TEXT_RANGE [UIA]</text>

    <!-- Floating Bubble Capsule Wireframe -->
    <g transform="translate(110, 192)">
      <rect x="4" y="4" width="280" height="44" rx="22" fill="url(#halftoneCharcoal)" />
      <rect width="280" height="44" rx="22" fill="#F5F1E8" stroke="#30343A" stroke-width="2" />
      <circle cx="26" cy="22" r="10" fill="none" stroke="#2148B8" stroke-width="1.5" />
      <line x1="50" y1="22" x2="102" y2="22" stroke="#30343A" stroke-width="2" />
      <line x1="118" y1="22" x2="170" y2="22" stroke="#30343A" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="186" y1="22" x2="254" y2="22" stroke="#30343A" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <line x1="36" y1="278" x2="380" y2="278" stroke="#30343A" stroke-width="1.5" opacity="0.25" />
    <line x1="36" y1="306" x2="310" y2="306" stroke="#30343A" stroke-width="1.5" opacity="0.25" />
  </g>

  <!-- Streaming Card Specimen (Dominant Object Crossing Grid) -->
  <g transform="translate(496, 116)">
    <!-- Halftone Offset Shadow Plate -->
    <rect x="12" y="12" width="612" height="544" fill="url(#halftoneCharcoal)" stroke="#30343A" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Main Wireframe Plate -->
    <rect width="612" height="544" fill="#F5F1E8" stroke="#30343A" stroke-width="2" />
    <line x1="0" y1="48" x2="612" y2="48" stroke="#30343A" stroke-width="1.2" />

    <!-- Multi-Tab Strip -->
    <rect x="20" y="12" width="116" height="24" fill="#30343A" />
    <text x="34" y="28" fill="#F5F1E8" font-family="Geist Mono, monospace" font-size="11">TAB 01 · SSE</text>
    <rect x="144" y="12" width="110" height="24" fill="none" stroke="#30343A" stroke-width="1" />
    <text x="158" y="28" fill="#30343A" font-family="Geist Mono, monospace" font-size="11">TAB 02 · WEB</text>

    <!-- Reasoning Fold Block -->
    <rect x="28" y="72" width="556" height="104" fill="url(#halftoneCobalt)" stroke="#2148B8" stroke-width="1.2" stroke-dasharray="5 4" />
    <text x="44" y="96" fill="#2148B8" font-family="Geist Mono, monospace" font-size="11" font-weight="600">REASONING_CHAIN · DEEPSEEK R1</text>
    <line x1="44" y1="118" x2="490" y2="118" stroke="#30343A" stroke-width="1.5" />
    <line x1="44" y1="140" x2="410" y2="140" stroke="#30343A" stroke-width="1.5" />

    <!-- Structured Answer Wireframe -->
    <line x1="28" y1="210" x2="520" y2="210" stroke="#30343A" stroke-width="2.5" />
    <line x1="28" y1="238" x2="560" y2="238" stroke="#30343A" stroke-width="1.5" />
    <line x1="28" y1="264" x2="440" y2="264" stroke="#30343A" stroke-width="1.5" />

    <!-- Code & Formula Specimen Box -->
    <rect x="28" y="296" width="556" height="142" fill="none" stroke="#30343A" stroke-width="1.5" />
    <rect x="28" y="296" width="160" height="26" fill="#30343A" />
    <text x="40" y="313" fill="#F5F1E8" font-family="Geist Mono, monospace" font-size="10">RUST · TOKIO SSE</text>
    <line x1="48" y1="350" x2="360" y2="350" stroke="#30343A" stroke-width="1.5" />
    <line x1="48" y1="376" x2="480" y2="376" stroke="#30343A" stroke-width="1.5" />
    <line x1="48" y1="402" x2="290" y2="402" stroke="#2148B8" stroke-width="1.5" />

    <!-- Follow-up Input Wireframe -->
    <rect x="28" y="466" width="556" height="52" fill="none" stroke="#30343A" stroke-width="1.5" />
    <text x="46" y="496" fill="#30343A" font-family="Geist Mono, monospace" font-size="12">FOLLOW_UP_PROMPT_BUFFER...</text>
    <circle cx="556" cy="492" r="14" fill="#2148B8" />
  </g>

  <!-- Ruled Metadata Strip -->
  <text x="64" y="742" fill="#30343A" font-family="Geist Mono, monospace" font-size="12">
    PLACEHOLDER · /public/placeholders/preview-overview-placeholder.svg
  </text>
  <text x="940" y="742" fill="#30343A" font-family="Geist Mono, monospace" font-size="12">
    SCALE 1:1 · 1200 × 800 PX
  </text>
</svg>
