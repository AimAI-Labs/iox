<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="halftoneD" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.4" fill="#30343A" opacity="0.26" />
    </pattern>
    <pattern id="halftoneTerracottaD" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#C65F38" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#F5F1E8" />
  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#30343A" stroke-width="1.5" />
  <line x1="36" y1="88" x2="1164" y2="88" stroke="#30343A" stroke-width="1" />
  <line x1="36" y1="712" x2="1164" y2="712" stroke="#30343A" stroke-width="1" />

  <text x="64" y="67" fill="#30343A" font-family="Geist Mono, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
