    </text>
    <rect x="56" y="96" width="520" height="380" fill="none" stroke="#30343A" stroke-width="1.5" />
    <line x1="84" y1="140" x2="460" y2="140" stroke="#30343A" stroke-width="2" />
    <line x1="84" y1="172" x2="510" y2="172" stroke="#30343A" stroke-width="1.5" />
    <line x1="84" y1="204" x2="420" y2="204" stroke="#30343A" stroke-width="1.5" />
    <rect x="84" y="248" width="460" height="190" fill="url(#halftoneD)" stroke="#30343A" stroke-width="1.2" />

    <!-- Radial Floating Button & Fan-out Satellites (Focal Event) -->
    <g transform="translate(728, 260)">
      <circle cx="0" cy="0" r="118" fill="url(#halftoneTerracottaD)" stroke="#C65F38" stroke-width="1.2" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="32" fill="#30343A" />
      <text x="-18" y="4" fill="#F5F1E8" font-family="Geist Mono, monospace" font-size="11">44PX</text>

      <!-- 4 Pinned Radial Satellites -->
      <circle cx="0" cy="-82" r="20" fill="#F5F1E8" stroke="#C65F38" stroke-width="2" />
      <circle cx="-74" cy="-34" r="20" fill="#F5F1E8" stroke="#C65F38" stroke-width="2" />
      <circle cx="-74" cy="34" r="20" fill="#F5F1E8" stroke="#C65F38" stroke-width="2" />
      <circle cx="0" cy="82" r="20" fill="#F5F1E8" stroke="#C65F38" stroke-width="2" />
    </g>
  </g>

  <text x="64" y="742" fill="#30343A" font-family="Geist Mono, monospace" font-size="12">
