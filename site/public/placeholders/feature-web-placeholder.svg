  </text>
  <text x="900" y="67" fill="#C65F38" font-family="Geist Mono, monospace" font-size="12" font-weight="500">
    INK: #30343A + #C65F38
  </text>

  <g transform="translate(150, 124)">
    <rect x="12" y="12" width="900" height="540" rx="20" fill="url(#halftoneD)" stroke="#30343A" stroke-width="1" />
    <rect width="900" height="540" rx="20" fill="#F5F1E8" stroke="#30343A" stroke-width="2" />

    <!-- Web Portal Content Lines -->
    <text x="56" y="68" fill="#30343A" font-family="Geist Mono, monospace" font-size="13" font-weight="600">
