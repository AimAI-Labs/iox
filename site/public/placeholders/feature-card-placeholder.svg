      <circle cx="5" cy="5" r="1.4" fill="#30343A" opacity="0.26" />
    </pattern>
    <pattern id="halftoneCobaltC" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#2148B8" opacity="0.22" />
