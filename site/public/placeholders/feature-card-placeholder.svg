    <line x1="58" y1="286" x2="480" y2="286" stroke="#30343A" stroke-width="2" />
    <line x1="58" y1="316" x2="440" y2="316" stroke="#30343A" stroke-width="1.5" />
    <rect x="58" y="346" width="460" height="58" fill="url(#halftoneC)" stroke="#30343A" stroke-width="1" />
    <text x="148" y="380" fill="#30343A" font-family="Geist Mono, monospace" font-size="14" font-weight="600">L(θ) = E[log π_θ(a|s)]</text>

