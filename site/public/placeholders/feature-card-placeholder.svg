    <line x1="590" y1="286" x2="820" y2="286" stroke="#30343A" stroke-width="1.5" />
    <line x1="590" y1="314" x2="790" y2="314" stroke="#30343A" stroke-width="1.5" />
    <line x1="590" y1="342" x2="830" y2="342" stroke="#30343A" stroke-width="1.5" />

