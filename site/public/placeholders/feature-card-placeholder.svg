    <circle cx="856" cy="28" r="10" fill="none" stroke="#2148B8" stroke-width="1.8" />

    <!-- Collapsible Reasoning Specimen -->
    <rect x="36" y="80" width="828" height="116" fill="url(#halftoneCobaltC)" stroke="#2148B8" stroke-width="1.5" />
