name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'IOX ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($Version)) {
            $Version = "manual"
          }
          $ZipName = "iox_${Version}_x64_portable.zip"
          $ExePath = "src-tauri/target/release/iox.exe"
          
          if (Test-Path $ExePath) {
            Write-Host "Creating portable archive: $ZipName from $ExePath"
            Compress-Archive -Path $ExePath -DestinationPath $ZipName -Force
            Write-Host "Portable zip created successfully."
          } else {
            Write-Error "Could not find release binary at $ExePath"
            exit 1
          }

      - name: Upload Portable Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: iox_*_x64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
